<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>語音輸入存入Excel</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-size: 20px; }
        input { font-size: 20px; }
        button { font-size: 20px; }
    </style>
</head>
<body>
    <h2>市場磅秤檢查</h2>
    <label>用戶（最多30字）:</label>
    <input type="text" id="user" maxlength="30" style="width: 600px;">
    <button onclick="startSpeech('user', 'zh-TW')">🎤</button>
    <br>
    
    <label>檢定合格單號（最多20字，只限英文與數字）:</label>
    <input type="text" id="certificate" maxlength="20" oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9]/g, '')">
    <button onclick="startSpeech('certificate', 'zh-TW', true)">🎤</button>
    <br>
    
    <label>經度:</label>
    <input type="text" id="longitude" readonly>
    <button onclick="getLocation()">取得經緯度</button>
    <br>
    
    <label>緯度:</label>
    <input type="text" id="latitude" readonly>
    <br>
    
    <button onclick="saveToExcel()">存入 EXCEL</button>
    
    <script>
        let timeout;
        function startSpeech(inputId, lang, isCertificate = false) {
            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = lang;
    
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;
            recognition.start();
            
            recognition.onresult = function(event) {
                let transcript = event.results[0][0].transcript;
                
                if (isCertificate) {
                    transcript = transcript.toUpperCase().replace(/[^A-Z0-9]/g, '');
                    transcript = fixCertificateFormat(transcript); // 確保格式正確
                }
                
                document.getElementById(inputId).value = transcript;
            };
            
            recognition.onerror = function(event) {
                console.error('語音辨識錯誤:', event.error);
                alert('語音輸入失敗，請再試一次。');
            };

            recognition.onspeechend = function() {
                recognition.stop();
            };

            clearTimeout(timeout);
            timeout = setTimeout(() => {
                recognition.stop();
                alert('輸入時間超過 5 分鐘，已取消。');
            }, 5 * 60 * 1000);
        }

        function fixCertificateFormat(transcript) {
            if (transcript.length < 5) return transcript;

            let fixed = "";
            fixed += transcript[0].match(/[A-Z]/) ? transcript[0] : "A"; 
            fixed += transcript[1].match(/[0-9]/) ? transcript[1] : "0";
            fixed += transcript[2].match(/[A-Z]/) ? transcript[2] : "B";
            fixed += transcript[3].match(/[A-Z]/) ? transcript[3] : "C";

            for (let i = 4; i < transcript.length; i++) {
                fixed += transcript[i].match(/[0-9]/) ? transcript[i] : "";
            }

            return fixed;
        }  
        function formatCertificate(text) {
            let matches = text.match(/[A-Z]/g);
            let digits = text.match(/\d/g);
            
            if (!matches || matches.length < 3 || !digits || digits.length < 2) return text;
            
            return matches[0] + digits[0] + matches.slice(1, 3).join('') + digits.slice(1).join('');
        }
      

        function saveToExcel() {
            let user = document.getElementById('user').value.trim();
            let certificate = document.getElementById('certificate').value.trim();
            let longitude = document.getElementById('longitude').value.trim();
            let latitude = document.getElementById('latitude').value.trim();
            if (!user || !certificate) {
                alert('請填寫完整資料');
                return;
            }
            
            let currentTime = new Date().toLocaleString('zh-TW', { hour12: false });
            
            let wb = XLSX.utils.book_new();
            let ws = XLSX.utils.aoa_to_sheet([['時間', '用戶', '檢定合格單號', '經度', '緯度']]);
            
            let prevData = localStorage.getItem('excelData');
            let data = prevData ? JSON.parse(prevData) : [];
            data.push([currentTime, user, certificate, longitude, latitude]);
            localStorage.setItem('excelData', JSON.stringify(data));
            
            XLSX.utils.sheet_add_aoa(ws, data, { origin: -1 });
            XLSX.utils.book_append_sheet(wb, ws, '資料');
            XLSX.writeFile(wb, '語音輸入.xlsx');
            // 清空輸入欄位
            document.getElementById('user').value = "";
            document.getElementById('certificate').value = "";
            document.getElementById('longitude').value = "";
            document.getElementById('latitude').value = "";
        }
        
        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    document.getElementById('longitude').value = position.coords.longitude;
                    document.getElementById('latitude').value = position.coords.latitude;
                }, function(error) {
                    console.error('無法獲取位置:', error);
                    alert('無法取得 GPS 位置，請檢查是否允許存取');
                });
            } else {
                alert("您的瀏覽器不支援定位功能");
            }
        }
        
        getLocation();
    </script>
</body>
</html>
